        <label><input type="radio" name="level" value="Intermediate (B1-B2)"><span><b data-t="l2"></b><small class="cefr">B1–B2</small></span></label>
        <label><input type="radio" name="level" value="Advanced (C1-C2)"><span><b data-t="l3"></b><small class="cefr">C1–C2</small></span></label>
        <label><input type="radio" name="level" value="Native"><span data-t="l4"></span></label>

    <fieldset class="card">
      <legend><span data-t="districts"></span><small data-t="multi"></small></legend>

    <fieldset class="card">
      <legend><span data-t="times"></span><small data-t="multi"></small></legend>

        <label><input type="checkbox" name="times" value="Saturday evening"><span data-t="t2"></span></label>
        <label><input type="checkbox" name="times" value="Sunday evening"><span data-t="t3"></span></label>

    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="cta"><div class="cta-bar"><button class="send" type="submit" data-t="send"></button></div></div>
    <p class="kvkk anl2" data-t="anl"></p>

</div>

<div class="done" id="done">
  <div class="ring">✓</div>
  <h2 id="doneTitle"></h2>
  <p data-t="doneText"></p>
  <a class="igbtn" href="/"><span data-t="home"></span></a>
</div>

<script>
// 1) Apps Script "Web app" URL'sini buraya yapıştır:
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyUQsxbt3u6CwMxh9Qd8XbPSHXRYXvjdms9JeoNQXwle5D-ZYAtPBbMFppZODabd6sSMg/exec";

const DISTRICTS = ["Karşıyaka","Bornova","Alsancak","Göztepe","Balçova","Çiğli","Buca","Gaziemir"];

const T = {
 tr:{title:"Topluluğa katıl.",lead:"Kadınlara özel, oyunlarla İngilizce konuşma kulübü. Bu formla WhatsApp duyuru grubumuza katılırsın. Etkinliklere katılmak tamamen senin kararın, hiçbir taahhüt yok.",
  name:"Adın soyadın ne?",namePh:"Adın ve soyadın",nameHint:"Gruba gerçek adınla ekleyebiliyoruz, lütfen tam adını yaz.",
  phone:"WhatsApp numaran veya kullanıcı adın ne?",phHint:"Numaranı ya da WhatsApp kullanıcı adını yazabilirsin.",phLink:"WhatsApp kullanıcı adımı nerede bulurum?",phInfo:"Kullanıcı adın varsa WhatsApp → Ayarlar → Profil bölümünde görünür.",cNum:"Telefon numarası",cUser:"WhatsApp kullanıcı adı",uPh:"WhatsApp kullanıcı adın",
  level:"İngilizce seviyen nedir?",l1:"Başlangıç",l2:"Orta",l3:"İleri",l4:"Ana dilim",multi:"İstediğin kadar seçebilirsin.",
  districts:"Hangi semtlerdeki etkinliklere katılmak isterdin?",times:"Hangi günler sana uyar?",
  t1:"Hafta içi akşam",t2:"Cumartesi akşam",t3:"Pazar akşam",t0:"Gündüz",any:"Fark etmez",
  freeB:"Ücretsiz",anl:"Siteyi geliştirmek için anonim kullanım verisi toplanır (Microsoft Clarity).",freeH:"Girl Talk topluluğuna katıl",freeTag:"Ücretsiz katılım",free:"İzmir'deki İngilizce konuşma etkinliklerimize katıl,\netkinlik detaylarından anında haberdar ol 🤍",kvkkA:"Kişisel verilerin ",kvkkLink:"KVKK aydınlatma metni",kvkkB:" kapsamında işlenir.",
  kvkkText:"Girl Talk İzmir olarak ad soyad, WhatsApp numarası veya kullanıcı adı, İngilizce seviyesi, semt ve zaman tercihlerini; başvurunu değerlendirmek, kadınlara özel topluluk güvenliğini sağlamak, seni WhatsApp duyuru grubuna eklemek ve etkinlik planlamak amacıyla, talep ettiğin hizmeti sunmak için (KVKK m.5/2-c) işliyoruz. Veriler Google Sheets üzerinde saklanır (yurt dışında bulunan sunucular), üçüncü kişilerle paylaşılmaz ve en fazla 2 yıl tutulur. KVKK m.11 kapsamındaki haklarını kullanmak veya verilerinin silinmesini istemek için Instagram @girltalk.izmir hesabımıza yazabilirsin.",
  send:"Topluluğa katıl",sending:"Gönderiliyor…",errName:"Lütfen adını ve soyadını yaz.",errUser:"Kullanıcı adını kontrol eder misin? En az 3 karakter olmalı.",errPhone:"Numaranı kontrol eder misin? 5XX XXX XX XX şeklinde 10 hane olmalı.",errReq:"Lütfen tüm alanları doldur, en az bir semt ve bir zaman seç.",errNet:"Bir sorun oldu, tekrar dener misin?",
  home:"Anasayfaya dön",hi:n=>`Hoş geldin${n?", "+n:""} 🤍`,doneText:"Artık Girl Talk'un bir parçasısın. En kısa süre içinde seni WhatsApp duyuru grubumuza ekleyeceğiz. Buluşmalarımızı orada duyuracağız, görüşmek üzere 🥂",ig:"Instagram'da bizi takip et"},
 en:{title:"Join the community.",lead:"A women-only English speaking club, built around games. This form adds you to our WhatsApp announcement group. Joining events is entirely your choice, no commitment.",
  name:"What's your full name?",namePh:"Your first and last name",nameHint:"We can only add you with your real name, so please use your full name.",
  phone:"What's your WhatsApp number or username?",phHint:"You can enter your number or your WhatsApp username.",phLink:"Where do I find my WhatsApp username?",phInfo:"If you have a username, you can find it in WhatsApp → Settings → Profile.",cNum:"Phone number",cUser:"WhatsApp username",uPh:"Your WhatsApp username",
  level:"What's your English level?",l1:"Beginner",l2:"Intermediate",l3:"Advanced",l4:"Native",multi:"Choose as many as you like.",
  districts:"Where would you like to join events?",times:"Which days work for you?",
  t1:"Weekday evening",t2:"Saturday evening",t3:"Sunday evening",t0:"Daytime",any:"No preference",
  freeB:"Free",anl:"We collect anonymous usage data to improve the site (Microsoft Clarity).",freeH:"Join the Girl Talk community",freeTag:"Free to join",free:"Join our English speaking events in İzmir\nand get event details the moment they're out 🤍",kvkkA:"Your data is processed as described in our ",kvkkLink:"KVKK privacy notice",kvkkB:".",
  kvkkText:"Girl Talk İzmir processes your name, WhatsApp number or username, English level, area and time preferences, to provide the service you request (KVKK Art. 5/2-c): to review your application, keep our women-only community safe, add you to our WhatsApp announcement group and plan events. Data is stored in Google Sheets (servers located abroad), is never shared with third parties and is kept for up to 2 years. To exercise your rights under Turkish data protection law (KVKK Art. 11) or to request deletion, message us on Instagram @girltalk.izmir.",
  send:"Join the community",sending:"Sending…",errName:"Please enter your first and last name.",errUser:"Please check your username, it needs at least 3 characters.",errPhone:"Please check your number. Turkish numbers have 10 digits: 5XX XXX XX XX.",errReq:"Please fill in every field and pick at least one area and one time.",errNet:"Something went wrong, please try again.",
  home:"Back to home",hi:n=>`Welcome${n?", "+n:""} 🤍`,doneText:"You're officially part of Girl Talk. We'll add you to our WhatsApp announcement group as soon as possible. Our meetups are announced there, see you soon 🥂",ig:"Follow us on Instagram"}
};

document.getElementById("districts").innerHTML=DISTRICTS.concat("Any").map(d=>`<label><input type="checkbox" name="districts" value="${d}"><span${d==="Any"?' data-t="any"':""}>${d}</span></label>`).join("");

const CC=[["🇹🇷","90"],["🇩🇪","49"],["🇬🇧","44"],["🇺🇸","1"],["🇮🇹","39"],["🇪🇸","34"],["🇫🇷","33"],["🇳🇱","31"],["🇧🇪","32"],["🇦🇹","43"],["🇨🇭","41"],["🇵🇱","48"],["🇵🇹","351"],["🇬🇷","30"],["🇧🇬","359"],["🇷🇴","40"],["🇸🇪","46"],["🇺🇦","380"],["🇷🇺","7"],["🇦🇿","994"],["🇮🇷","98"],["🇮🇳","91"],["🇧🇷","55"],["🇲🇽","52"],["🇪🇬","20"],["🇳🇬","234"],["🇨🇳","86"],["🇰🇷","82"],["🇯🇵","81"],["🌐","+"]];
const cc=document.getElementById("cc");cc.innerHTML=CC.map(([f,c])=>`<option value="${c}">${f} ${c==="+"?"+…":"+"+c}</option>`).join("");
const ph=document.getElementById("phone"),wau=document.getElementById("wauser"),telBox=document.getElementById("telBox");
let ctype="num";document.querySelectorAll(".segc button").forEach(b=>b.onclick=()=>{ctype=b.dataset.v;document.querySelectorAll(".segc button").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-selected",x===b)});const u=ctype==="user";b.parentNode.classList.toggle("u",u);telBox.hidden=u;wau.hidden=!u;const el=u?wau:ph;el.focus({preventScroll:true});setTimeout(()=>el.scrollIntoView({block:"center",behavior:"smooth"}),350);});
function contact(){
  if(ctype==="user"){const u=wau.value.trim().replace(/^@+/,"");return{v:u?"@"+u:"",type:"Kullanıcı adı"};}
  const v=ph.value.trim();if(!v)return{v:"",type:""};
  const n=v.replace(/[^\d+]/g,"").replace(/^0+/,"");
  return{v:cc.value==="+"||n.startsWith("+")?n:"+"+cc.value+n,type:"Numara"};}
function nameOk(){const w=form.elements.name.value.trim().split(/\s+/).filter(x=>x.replace(/[^\p{L}]/gu,"").length>=2);return w.length>=2;}
const nmErr=document.getElementById("nmErr"),nmIn=document.getElementById("name");
nmIn.addEventListener("blur",()=>{nmErr.hidden=!nmIn.value.trim()||nameOk();});
nmIn.addEventListener("input",()=>{if(!nmErr.hidden&&nameOk())nmErr.hidden=true;});
// scroll hint: shift content so a row is cut in half by the CTA bar on first view
function peek(){try{peek0()}catch(e){}}
function peek0(){if(scrollY>0)return;const lede=document.querySelector(".lede"),cards=[...document.querySelectorAll(".card")];
  lede.style.marginBottom="";cards.forEach(c=>c.style.marginBottom="");
  const bar=document.querySelector(".cta-bar").getBoundingClientRect().top;
  const rs=[...document.querySelectorAll(".chips span,.card input[type=text]:not([hidden]),.card input[type=tel],.segc")].map(e=>e.getBoundingClientRect()).filter(r=>r.height>30);
  let best=null,bt=0;for(const r of rs){const s=bar-(r.top+r.height/2);if(s>=-80&&s<=72&&(best===null||Math.abs(s)<Math.abs(best))){best=s;bt=r.top;}}
  if(best===null)return;const above=cards.filter(c=>c.getBoundingClientRect().bottom<bt);const k=best/(above.length+1);
  lede.style.marginBottom=(28+k)+"px";above.forEach(c=>c.style.marginBottom=(28+k)+"px");}
document.addEventListener("focusin",e=>{if(e.target.matches("input,select,button"))document.body.classList.add("touched")});
addEventListener("load",peek);addEventListener("resize",peek);
function phoneOk(){const c=contact();if(!c.v)return false;
  if(ctype==="user")return /^@[A-Za-z0-9._]{3,30}$/.test(c.v);
  const d=c.v.replace(/\D/g,"");
  if(d.startsWith("90"))return /^905\d{9}$/.test(d);
  return d.length>=8&&d.length<=15;}
const phErr=document.getElementById("phErr");
function normPh(){if(cc.value!=="90")return;const v=ph.value.trim(),c=v.replace(/[\s()-]/g,"");
  let m=c.match(/^(?:\+90|0090|90(?=5\d{9}$)|0)(5\d*)$/);if(m)ph.value=m[1];}
ph.addEventListener("input",normPh);ph.addEventListener("blur",normPh);ph.addEventListener("change",normPh);
function showPhErr(){phErr.textContent=T[lang][ctype==="user"?"errUser":"errPhone"];phErr.hidden=false;}
[ph,wau].forEach(i=>i.addEventListener("blur",()=>{const c=contact();if(c.v&&!phoneOk())showPhErr();else phErr.hidden=true;}));
[ph,wau].forEach(i=>i.addEventListener("input",()=>{if(!phErr.hidden&&phoneOk())phErr.hidden=true;}));

let lang=(navigator.language||"tr").toLowerCase().startsWith("tr")?"tr":"en";
try{lang=localStorage.getItem("gt-lang")||lang}catch(e){}
function setLang(l){
  lang=l;document.documentElement.lang=l;
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=T[l][el.dataset.t]});
  document.querySelectorAll("[data-ph]").forEach(el=>{el.placeholder=T[l][el.dataset.ph]});
    document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  try{localStorage.setItem("gt-lang",l)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
setLang(lang);

const form=document.getElementById("form"),err=document.getElementById("err"),btn=form.querySelector(".send");
const vals=n=>[...form.querySelectorAll(`input[name=${n}]:checked`)].map(i=>i.value).join(", ");

function celebrate(){
  const d=document.getElementById("done"),c=["#D9A9B8","#C6A46A","#401522"];
  for(let i=0;i<40;i++){const s=document.createElement("i");s.className="conf";s.style.left=Math.random()*100+"%";s.style.background=c[i%3];s.style.animationDuration=(2.2+Math.random()*2)+"s";s.style.animationDelay=Math.random()*.6+"s";d.appendChild(s)}
}

// iOS-style feedback: haptic on select + CTA wakes up when form is complete
const hap=document.createElement("label");hap.style.display="none";hap.innerHTML='<input type="checkbox" switch>';document.body.appendChild(hap);
function tick(){try{if(navigator.vibrate)navigator.vibrate(8);else hap.click();}catch(e){}}
function ready(){const c=contact();btn.classList.toggle("ready",!!(form.elements.name.value.trim()&&nameOk()&&phoneOk()&&vals("level")&&vals("districts")&&vals("times")));}
form.addEventListener("change",e=>{if(e.target.closest(".chips"))tick();ready();});
form.addEventListener("input",ready);
document.querySelectorAll(".segc button").forEach(b=>b.addEventListener("click",()=>{tick();ready();}));
ready();

form.onsubmit=async e=>{
  e.preventDefault();err.textContent="";
  if(form.elements.website.value)return; // bot
  const ct=contact();const data={name:form.elements.name.value.trim(),phone:ct.v,ctype:ct.type,level:vals("level"),districts:vals("districts"),times:vals("times"),lang};
  try{const s=JSON.parse(sessionStorage.getItem("gt-src")||"{}");data.source=s.s||(s.r?new URL(s.r).hostname:"direkt / paylaşılan link");data.medium=s.m||"";data.campaign=s.c||"";data.referrer=s.r||""}catch(_){}
  if(!nameOk()){nmErr.hidden=false;nmIn.scrollIntoView({block:"center",behavior:"smooth"});return;}
  if(!phoneOk()){showPhErr();ph.scrollIntoView({block:"center",behavior:"smooth"});return;}
  if(!data.name||!data.level||!data.districts||!data.times){err.textContent=T[lang].errReq;return;}
  btn.disabled=true;btn.textContent=T[lang].sending;
  try{
    await fetch(ENDPOINT,{method:"POST",mode:"no-cors",body:new URLSearchParams(data)});
    document.getElementById("doneTitle").textContent=T[lang].hi(data.name.split(/\s+/)[0]);
    document.getElementById("done").style.display="flex";celebrate();
  }catch(x){err.textContent=T[lang].errNet;btn.disabled=false;btn.textContent=T[lang].send;}
};
document.querySelectorAll("input").forEach(i=>i.addEventListener("focus",()=>setTimeout(()=>i.scrollIntoView({block:"center",behavior:"smooth"}),350)));
document.querySelectorAll(".info").forEach(b=>b.onclick=()=>{const x=document.getElementById(b.getAttribute("aria-controls"));const o=x.classList.toggle("open");b.setAttribute("aria-expanded",o)});
</script>
